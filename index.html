<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#001E62" />
  <meta name="description" content="Diversidade em Ação — jornada de 5 missões sobre a inclusão de Pessoas com Deficiência no mundo do trabalho." />
  <title>Diversidade em Ação</title>

  <!-- A marca do jogo: o arco da DOME com pessoas embaixo. SVG primeiro, PNG
       para quem não lê SVG (Safari antigo, alguns clientes de e-mail). -->
  <link rel="icon" type="image/svg+xml" href="/marca.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Divulgação: é esta imagem que aparece quando o link é colado no
       WhatsApp, no Teams ou num e-mail.

       ATENÇÃO: WhatsApp e a maior parte dos leitores exigem URL ABSOLUTA
       aqui. Depois do deploy, troque as duas linhas `content` abaixo pelo
       endereço real, por exemplo
       https://diversidade-em-acao.vercel.app/divulgacao.png -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Diversidade em Ação" />
  <meta property="og:description" content="Cinco missões sobre a inclusão de Pessoas com Deficiência no mundo do trabalho. Cerca de 10 minutos cada." />
  <meta property="og:image" content="/divulgacao.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/divulgacao.png" />

  <!-- Uma família só, em quatro pesos. UI de produto não precisa de par
       display + texto, e cada arquivo a menos é meio segundo a menos no 4G —
       que é onde a maior parte das 5.602 pessoas vai abrir isto. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
</head>
<body>
  <!-- O primeiro item tabulável da página. Some do fluxo visual até receber
       foco; sem ele, quem navega por teclado atravessa o cabeçalho inteiro
       em toda troca de tela. -->
  <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>

  <div id="raiz"></div>

  <!-- VLibras: tradução para Libras, mantida pelo Governo Federal. Num jogo
       sobre inclusão de PcD, a ausência dela seria contraditória. Carrega
       depois do app (defer) e falha em silêncio se o serviço estiver fora. -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>
  <script defer src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script defer>
    window.addEventListener('load', function () {
      try { new window.VLibras.Widget('https://vlibras.gov.br/app') } catch (e) { /* serviço fora do ar: segue sem */ }
    })
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
